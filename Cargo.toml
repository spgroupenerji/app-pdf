[package]
name = "pdf_goruntuleyici"
version = "2026.7.24-beta"
edition = "2021"
description = "MuPDF ve GPUI tabanli, GPU hizlandirmali Windows PDF goruntuleyici"

[dependencies]
# GPU hizlandirmali arayuz: GPUI, gpui-base, gpui-component ve Lucide ikonlari tek pakette.
gpui-kit = "=0.8.1"
# MuPDF Rust baglamlari (Cekirdek render motoru; C kaynagi derlenir)
mupdf = "0.8"
# Is parcaciklari arasi asenkron mesajlasma
crossbeam-channel = "0.5"
image = "0.25"

[build-dependencies]
# Windows exe ikonu: assets/logo.png derleme sirasinda .ico'ya donusturulup gomulur
embed-resource = "3.0"
ico = "0.5"
image = "0.25"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# GPUI ve bagimlilari debug derlemede de tam hizda calissin.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[patch.crates-io]
# Windows MSVC'de mupdf 0.8.0'in "max_align_t" derleme hatasini gideren yerel yama (github issue #222).
# Yalnizca Rust sarmalayici (mupdf) yamalanir; mupdf-sys crates.io'dan oldukca kullanilir.
mupdf = { path = "vendor/mupdf" }
